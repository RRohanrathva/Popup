name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Find project folder
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            find . -maxdepth 3 -not -path "./.git/*"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PopupNotify-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
