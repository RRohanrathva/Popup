name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare project (unzip if needed)
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No project and no zip found"
              exit 1
            fi
            echo "Unzipping $ZIP"
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            FILE=$(find extracted -name settings.gradle.kts | head -n 1)
          fi
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts still not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PopupNotify-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
