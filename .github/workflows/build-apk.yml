name: Build Expressive Popup APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if uploaded directly
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o "$ZIP_FILE"
              SUBDIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
                cp -r "$SUBDIR"/* .
              fi
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpressivePopupNotify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
